<meta name='viewport' content='width=device-width, initial-scale=1'/><style>* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #f1ede5;
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  padding: 2rem 1rem;
  margin: 0;
  color: #3e362c;
}

.tovar-kartochka {
  background: #fefcf6;
  border-radius: 2.5rem;
  padding: 2rem 1.8rem 1.8rem;
  max-width: 430px;
  width: 100%;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08), 0 1px 4px rgba(0,0,0,0.02);
  display: flex;
  flex-direction: column;
  gap: 1.4rem;
  transition: transform 0.3s ease, box-shadow 0.3s;
  margin-bottom: 2rem;
}

.tovar-kartochka:hover {
  transform: translateY(-4px);
  box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.1);
}

.izobrajenie-blok {
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 1.5rem;
  overflow: hidden;
  background: #eae3d5;
}

.kartinka {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.nazvanie {
  font-size: 1.8rem;
  font-weight: 650;
  line-height: 1.2;
  letter-spacing: -0.3px;
  color: #2f271c;
}

.podzagolovok {
  font-size: 0.95rem;
  color: #8c7c6a;
  margin-top: -0.8rem;
}

.blok-ceny {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.5rem;
}

.tekushaya-cena {
  font-size: 2.3rem;
  font-weight: 700;
  color: #2e2418;
  letter-spacing: -0.5px;
  line-height: 1;
  margin-right: 0.4rem;
}

.staraya-cena {
  font-size: 1rem;
  text-decoration: line-through;
  color: #b7a58b;
}

.skidka {
  background: #dcc9ad;
  color: #4f3822;
  font-weight: 600;
  padding: 0.2rem 0.8rem;
  border-radius: 1rem;
  font-size: 0.85rem;
}

.knopka-kupit {
  display: flex;
  align-items: center;
  justify-content: center;
  background: #b39264;
  color: white;
  padding: 0.9rem 1rem;
  border-radius: 2.5rem;
  font-weight: 600;
  font-size: 1.1rem;
  text-decoration: none;
  box-shadow: 0 8px 18px rgba(140, 110, 70, 0.25);
  transition: background 0.25s, box-shadow 0.25s, transform 0.1s;
  user-select: none;
  cursor: pointer;
}

.knopka-kupit:hover {
  background: #9a7b4c;
  box-shadow: 0 10px 22px rgba(120, 90, 50, 0.35);
}

.knopka-kupit:active {
  transform: scale(0.98);
}

.apisanije-blok {
  margin-top: 0.6rem;
  border-top: 1px solid #e8dece;
  padding-top: 1rem;
}

.chekboks-apisanije {
  display: none;
}

.ssylka-apisanije {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  cursor: pointer;
  font-weight: 500;
  color: #8b7355;
  transition: color 0.2s;
  user-select: none;
}

.ssylka-apisanije:hover {
  color: #5e402b;
}

.strelka {
  font-size: 0.9rem;
  transition: transform 0.3s;
}

.chekboks-apisanije:checked + .ssylka-apisanije .strelka {
  transform: rotate(180deg);
}

.tekst-apisanija {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1), margin-top 0.5s;
  margin-top: 0;
}

.chekboks-apisanije:checked ~ .tekst-apisanija {
  max-height: 30rem;
  margin-top: 1rem;
}

.tekst-apisanija p {
  font-size: 0.95rem;
  line-height: 1.7;
  color: #5a4a36;
  margin-bottom: 0.8rem;
}

.tekst-apisanija p:last-child {
  margin-bottom: 0;
}

@media (max-width: 480px) {
  .tovar-kartochka {
    padding: 1.4rem;
    gap: 1.1rem;
  }
  .nazvanie {
    font-size: 1.5rem;
  }
  .tekushaya-cena {
    font-size: 2rem;
  }
}</style>
